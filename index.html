<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sarina-Ai</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    
    /* هدر بالای صفحه */
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4caf50;
    }
    .youtube-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    .youtube-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .header { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 15px; }
    
    /* منوی تب‌ها */
    .nav { display: flex; gap: 6px; margin-bottom: 20px; width: 100%; max-width: 500px; flex-wrap: wrap; }
    .nav button { flex: 1; min-width: 100px; padding: 10px 5px; border: none; background: #e0e0e0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .nav button.active { background: #4caf50; color: white; }
    
    .tab-content { display: none; width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .tab-content.active { display: block; }
    
    /* بازی */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .card { aspect-ratio: 1; background: #2196f3; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; color: white; }
    .card.flipped { background: #fff; border: 2px solid #2196f3; }
    
    /* ورودی‌ها و دکمه‌ها */
    textarea, input[type="text"], input[type="password"] { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-top: 8px; }
    textarea { height: 80px; resize: none; }
    select, .action-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
    .action-btn { background: #ff9800; color: white; border: none; cursor: pointer; }
    .result-box { background: #f0f0f0; min-height: 60px; padding: 10px; border-radius: 8px; margin-top: 10px; word-break: break-word; position: relative; }

    /* گالری تصاویر */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .gallery-card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; }
    .gallery-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
    .gallery-card .img-title { font-size: 12px; font-weight: bold; margin: 5px 0; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gallery-card .card-btns { display: flex; gap: 4px; width: 100%; margin-top: 4px; }
    .gallery-card .card-btns button { flex: 1; padding: 6px 2px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; color: white; }
    .btn-download { background: #2196f3; }
    .btn-rename { background: #ff9800; }
    .btn-delete { background: #f44336; }

    .ai-img-result { width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
    
    .tts-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <img src="https://lh3.googleusercontent.com/d/1y-npJ0RAY2mvE_ER6fXLXKv7WchFHPeJ" class="user-avatar" alt="User Avatar">
    <a href="https://www.youtube.com/@naturescenic2" target="_blank" class="youtube-link">
      <span>طبیعت ایران naturescenic2</span>
      <img src="https://lh3.googleusercontent.com/d/1EZf35v8476qtDC_rTS_h-6-_zIq0RNTh" class="youtube-logo" alt="YouTube">
    </a>
  </div>

  <div class="header">sarina-Ai 🚀</div>

  <div class="nav">
    <button id="btn-game" class="active" onclick="switchTab('game')">🎮 بازی</button>
    <button id="btn-trans" onclick="switchTab('trans')">🌐 مترجم</button>
    <button id="btn-ai" onclick="switchTab('ai')">🎨 ساخت تصویر</button>
    <button id="btn-upload" onclick="switchTab('upload')">📸 گالری عکس</button>
  </div>

  <div id="tab-game" class="tab-content active">
    <h3 style="margin-top:0; text-align:center;">بازی حافظه 🎈</h3>
    <div class="grid" id="grid"></div>
  </div>

  <!-- تب مترجم -->
  <div id="tab-trans" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مترجم آنلاین گوگل</h3>
    <label>متن (فارسی یا هر زبانی):</label>
    <textarea id="sourceText" placeholder="متن خود را بنویسید..."></textarea>
    <label style="margin-top:10px; display:block;">ترجمه به زبان:</label>
    <select id="targetLang">
      <option value="en" selected>انگلیسی (English)</option>
      <option value="fa">فارسی</option>
      <option value="ar">عربی</option>
      <option value="tr">ترکی استانبولی</option>
      <option value="fr">فرانسوی</option>
      <option value="de">آلمانی</option>
      <option value="es">اسپانیایی</option>
      <option value="it">ایتالیایی</option>
      <option value="ru">روسی</option>
      <option value="zh-CN">چینی (ساده شده)</option>
      <option value="ja">ژاپنی</option>
      <option value="ko">کره‌ای</option>
      <option value="hi">هندی</option>
      <option value="pt">پرتغالی</option>
      <option value="nl">هلندی</option>
      <option value="sv">سوئدی</option>
      <option value="el">یونانی</option>
      <option value="pl">لهستانی</option>
      <option value="uk">اوکراینی</option>
      <option value="ro">رومانیایی</option>
      <option value="hu">مجاری</option>
      <option value="fi">فنلاندی</option>
      <option value="no">نروژی</option>
      <option value="da">دانمارکی</option>
      <option value="cs">چکی</option>
      <option value="th">تایلندی</option>
      <option value="vi">ویتنامی</option>
      <option value="id">اندونزیایی</option>
      <option value="ms">مالایی</option>
      <option value="ur">اردو</option>
      <option value="bn">بنگالی</option>
      <option value="sw">سواحیلی</option>
      <option value="az">آذربایجانی</option>
      <option value="hy">ارمنی</option>
      <option value="ka">گرجی</option>
      <option value="fil">فیلیپینی</option>
      <option value="he">عبری</option>
    </select>
    <button class="action-btn" onclick="translateText()">ترجمه آنلاین</button>
    <h4>نتیجه ترجمه:</h4>
    <div class="result-box" id="resultBoxContainer">
      <button class="tts-btn" onclick="speakTranslation()" title="پخش صوتی">🔊</button>
      <div id="resultText" style="padding-left: 35px;">نتیجه اینجا نمایش داده می‌شود...</div>
    </div>
  </div>

  <div id="tab-ai" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مولد تصویر هوشمند 🎨</h3>
    <label>توصیف تصویر به فارسی:</label>
    <input type="text" id="aiPrompt" placeholder="مثلاً: یک کلبه چوبی زیبا در جنگل‌های شمال ایران" oninput="autoTranslatePrompt()">
    
    <button class="action-btn" style="background:#2196f3; margin-top:8px;" onclick="manualTranslatePrompt()">🌐 ترجمه دستی با گوگل ترنسلیت</button>
    
    <label style="margin-top:10px; display:block; font-size:12px; color:#555;">ترجمه انگلیسی (جهت ارسال به AI):</label>
    <input type="text" id="aiPromptEn" placeholder="ترجمه انگلیسی هم‌زمان اینجا دیده می‌شود..." style="background:#f9f9f9; font-size:13px; color:#333;" dir="ltr">
    
    <button class="action-btn" style="background:#9c27b0;" onclick="generateImage()">ساخت تصویر با AI</button>
    <div id="aiStatus" style="margin-top:10px; text-align:center; font-size:14px; color:#666;"></div>
    <img id="aiResultImg" class="ai-img-result" alt="AI Generated Image">
  </div>

  <!-- تب گالری عکس -->
  <div id="tab-upload" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">آپلود لینک مستقیم عکس 📸</h3>
    
    <label>عنوان عکس:</label>
    <input type="text" id="directImageTitle" placeholder="مثلاً: عکس طبیعت شمال">

    <label style="margin-top:8px; display:block;">لینک مستقیم تصویر (URL):</label>
    <input type="text" id="directImageUrl" placeholder="https://example.com/image.jpg" dir="ltr">
    
    <label style="margin-top:8px; display:block;">رمز عبور مدیر:</label>
    <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید">
    
    <button class="action-btn" style="background:#4caf50;" onclick="addDirectImage()">افزودن عکس به گالری</button>
    <button class="action-btn" style="background:#607d8b; margin-top:8px;" onclick="changeAdminPassword()">🔑 تغییر رمز عبور مدیر</button>
    
    <div class="gallery" id="galleryGrid"></div>
  </div>

  <script>
    function getStoredPassword() {
      return localStorage.getItem('app_admin_pass') || "123456";
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
    }

    /* بازی */
    const icons = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
    let flipped = [], matched = 0;
    icons.sort(() => 0.5 - Math.random());
    const grid = document.getElementById('grid');
    icons.forEach((icon) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.onclick = () => {
        if (flipped.length < 2 && !card.classList.contains('flipped')) {
          card.classList.add('flipped');
          card.textContent = icon;
          flipped.push(card);
          if (flipped.length === 2) {
            if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
              matched += 2;
              flipped = [];
              if (matched === icons.length) setTimeout(() => alert('آفرین! 🎉'), 300);
            } else {
              setTimeout(() => {
                flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
                flipped = [];
              }, 800);
            }
          }
        }
      };
      grid.appendChild(card);
    });

    /* تابع ترجمه دقیق (جلوگیری از ایجاد متن فینگلیش) */
    async function fetchTranslation(text, targetLang) {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Network response was not ok');
      
      const data = await res.json();
      let translatedText = '';
      
      if (data && data[0]) {
        for (let i = 0; i < data[0].length; i++) {
          if (data[0][i] && data[0][i][0]) {
            translatedText += data[0][i][0];
          }
        }
      }
      
      if (!translatedText.trim()) throw new Error('Empty translation');
      return translatedText;
    }

    async function translateText() {
      const text = document.getElementById('sourceText').value;
      const target = document.getElementById('targetLang').value;
      const resultBox = document.getElementById('resultText');
      
      if (!text.trim()) { resultBox.textContent = 'لطفاً متنی برای ترجمه وارد کنید.'; return; }
      resultBox.textContent = 'در حال ترجمه...';

      try {
        const result = await fetchTranslation(text, target);
        resultBox.textContent = result;
      } catch (err) {
        // روش جایگزین در صورت بروز خطای سرور
        try {
          const res2 = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|${target}`);
          const data2 = await res2.json();
          if (data2 && data2.responseData && data2.responseData.translatedText) {
            resultBox.textContent = data2.responseData.translatedText;
          } else {
            resultBox.textContent = 'خطا در ارتباط با سرور ترجمه.';
          }
        } catch (e) {
          resultBox.textContent = 'خطا در ارتباط با سرور ترجمه.';
        }
      }
    }

    /* تلفظ صوتی متن ترجمه شده */
    function speakTranslation() {
      const text = document.getElementById('resultText').textContent;
      const lang = document.getElementById('targetLang').value;
      if (!text || text === 'نتیجه اینجا نمایش داده می‌شود...' || text === 'در حال ترجمه...' || text === 'خطا در ارتباط با سرور ترجمه.') return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('مرورگر شما از قابلیت خواندن صوتی پشتیبانی نمی‌کند.');
      }
    }

    /* ترجمه پرامپت هوش مصنوعی */
    let translateTimer;
    function autoTranslatePrompt() {
      clearTimeout(translateTimer);
      translateTimer = setTimeout(manualTranslatePrompt, 600);
    }

    async function manualTranslatePrompt() {
      const prompt = document.getElementById('aiPrompt').value;
      const enInput = document.getElementById('aiPromptEn');
      if (!prompt.trim()) { enInput.value = ''; return; }
      
      try {
        const translated = await fetchTranslation(prompt, 'en');
        enInput.value = translated;
      } catch (e) {
        enInput.value = prompt;
      }
    }

    /* ساخت تصویر */
    async function generateImage() {
      let enPrompt = document.getElementById('aiPromptEn').value;
      const promptFa = document.getElementById('aiPrompt').value;
      const status = document.getElementById('aiStatus');
      const img = document.getElementById('aiResultImg');
      
      if (!promptFa.trim() && !enPrompt.trim()) { alert('لطفاً توصیف تصویر را بنویسید.'); return; }
      if (!enPrompt.trim()) enPrompt = promptFa;

      status.textContent = 'در حال ساخت تصویر با هوش مصنوعی... لطفاً چند ثانیه صبر کنید.';
      img.style.display = 'none';

      try {
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enPrompt)}?width=512&height=512&nologo=true`;
        img.src = imageUrl;
        img.onload = () => {
          status.textContent = '';
          img.style.display = 'block';
        };
      } catch (e) {
        status.textContent = 'خطا در ساخت تصویر.';
      }
    }

    /* مدیریت گالری عکس‌ها (افزودن، دانلود، تغییر نام، حذف با رمز) */
    function addDirectImage() {
      const titleInput = document.getElementById('directImageTitle');
      const urlInput = document.getElementById('directImageUrl');
      const passInput = document.getElementById('adminPassword');

      if (!urlInput.value.trim()) {
        alert('لطفاً لینک مستقیم تصویر را وارد کنید.');
        return;
      }

      if (passInput.value !== getStoredPassword()) {
        alert('رمز عبور اشتباه است! دسترسی غیرمجاز.');
        return;
      }

      const imgTitle = titleInput.value.trim() || 'تصویر جدید';
      createGalleryCard(imgTitle, urlInput.value.trim());

      titleInput.value = '';
      urlInput.value = '';
      passInput.value = '';
      alert('تصویر با موفقیت اضافه شد!');
    }

    function createGalleryCard(title, url) {
      const gallery = document.getElementById('galleryGrid');

      const card = document.createElement('div');
      card.className = 'gallery-card';

      const img = document.createElement('img');
      img.src = url;
      img.alt = title;
      img.onerror = () => alert('لینک تصویر بارگذاری نشد یا معتبر نیست.');

      const titleEl = document.createElement('div');
      titleEl.className = 'img-title';
      titleEl.textContent = title;

      const btnsDiv = document.createElement('div');
      btnsDiv.className = 'card-btns';

      const downloadBtn = document.createElement('button');
      downloadBtn.className = 'btn-download';
      downloadBtn.textContent = 'دانلود';
      downloadBtn.onclick = () => downloadImage(url, titleEl.textContent);

      const renameBtn = document.createElement('button');
      renameBtn.className = 'btn-rename';
      renameBtn.textContent = 'تغییر نام';
      renameBtn.onclick = () => renameImage(titleEl);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-delete';
      deleteBtn.textContent = 'حذف';
      deleteBtn.onclick = () => deleteImage(card);

      btnsDiv.appendChild(downloadBtn);
      btnsDiv.appendChild(renameBtn);
      btnsDiv.appendChild(deleteBtn);

      card.appendChild(img);
      card.appendChild(titleEl);
      card.appendChild(btnsDiv);

      gallery.appendChild(card);
    }

    /* دانلود تصویر */
    async function downloadImage(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'image';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    /* تغییر نام با رمز عبور */
    function renameImage(titleElement) {
      const pass = prompt('لطفاً رمز عبور مدیر را وارد کنید:');
      if (pass !== getStoredPassword()) {
        alert('رمز عبور اشتباه است!');
        return;
      }
      const newTitle = prompt('نام جدید تصویر را وارد کنید:', titleElement.textContent);
      if (newTitle && newTitle.trim() !== '') {
        titleElement.textContent = newTitle.trim();
        alert('نام تصویر با موفقیت تغییر کرد.');
      }
    }

    /* حذف با رمز عبور */
    function deleteImage(cardElement) {
      const pass = prompt('لطفاً رمز عبور مدیر را وارد کنید:');
      if (pass !== getStoredPassword()) {
        alert('رمز عبور اشتباه است!');
        return;
      }
      if (confirm('آیا از حذف این تصویر اطمینان دارید؟')) {
        cardElement.remove();
        alert('تصویر حذف شد.');
      }
    }

    /* تغییر رمز عبور مدیر */
    function changeAdminPassword() {
      const currentPass = prompt('رمز عبور فعلی مدیر را وارد کنید:');
      if (currentPass !== getStoredPassword()) {
        alert('رمز عبور فعلی اشتباه است!');
        return;
      }
      const newPass = prompt('رمز عبور جدید را وارد کنید:');
      if (newPass && newPass.trim() !== '') {
        localStorage.setItem('app_admin_pass', newPass.trim());
        alert('رمز عبور مدیر با موفقیت تغییر یافت.');
      } else {
        alert('رمز عبور جدید نمی‌تواند خالی باشد.');
      }
    }
  </script>
</body>
</html>
