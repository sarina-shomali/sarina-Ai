<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sarina-Ai</title>
  <link rel="manifest" href="manifest.json">
  <!-- کتابخانه رسمی سوپابیس -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; direction: rtl; text-align: right; }
    
    .top-bar {
      width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center;
      background: #ffffff; padding: 10px 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 10px;
    }
    .user-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #4caf50; }
    .youtube-link { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #333; font-weight: bold; font-size: 13px; }
    .youtube-logo { width: 32px; height: 32px; object-fit: contain; }
    .header { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
    
    .apk-download-btn {
      width: 100%; max-width: 500px; background: #e91e63; color: white; border: none; padding: 12px;
      border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none;
      display: block; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(233,30,99,0.3);
    }

    .nav { display: flex; gap: 6px; margin-bottom: 20px; width: 100%; max-width: 500px; flex-wrap: wrap; }
    .nav button { flex: 1; min-width: 90px; padding: 10px 5px; border: none; background: #e0e0e0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .nav button.active { background: #4caf50; color: white; }
    
    .tab-content { display: none; width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .tab-content.active { display: block; }
    
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .card { aspect-ratio: 1; background: #2196f3; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; color: white; }
    .card.flipped { background: #fff; border: 2px solid #2196f3; }
    
    textarea, input[type="text"] { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-top: 8px; direction: rtl; text-align: right; }
    textarea { height: 80px; resize: none; }
    select, .action-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
    .action-btn { background: #ff9800; color: white; border: none; cursor: pointer; }
    
    .result-container { position: relative; background: #f0f0f0; min-height: 70px; padding: 10px; border-radius: 8px; margin-top: 10px; word-break: break-word; text-align: right; }
    .audio-btn { position: absolute; left: 10px; top: 10px; background: #4caf50; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: none; align-items: center; justify-content: center; }
    .pronunciation-box { margin-top: 8px; font-size: 13px; color: #555; font-style: italic; border-top: 1px dashed #ccc; padding-top: 5px; }

    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
    .ai-img-result { width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <img src="https://lh3.googleusercontent.com/d/1y-npJ0RAY2mvE_ER6fXLXKv7WchFHPeJ" class="user-avatar" alt="User Avatar">
    <a href="https://www.youtube.com/@naturescenic2" target="_blank" class="youtube-link">
      <span>طبیعت ایران naturescenic2</span>
      <img src="https://lh3.googleusercontent.com/d/1EZf35v8476qtDC_rTS_h-6-_zIq0RNTh" class="youtube-logo" alt="YouTube">
    </a>
  </div>

  <div class="header">sarina-Ai 🚀</div>

  <!-- دکمه دانلود APK -->
  <a href="#" class="apk-download-btn" onclick="alert('لینک مستقیم فایل APK برنامه‌تان را می‌توانید در این قسمت جای‌گذاری کنید.')">📲 دانلود مستقیم فایل APK برنامه</a>

  <div class="nav">
    <button id="btn-game" class="active" onclick="switchTab('game')">🎮 بازی</button>
    <button id="btn-trans" onclick="switchTab('trans')">🌐 مترجم</button>
    <button id="btn-ai" onclick="switchTab('ai')">🎨 ساخت تصویر</button>
    <button id="btn-upload" onclick="switchTab('upload')">📸 گالری آنلاین (سوپابیس)</button>
  </div>

  <div id="tab-game" class="tab-content active">
    <h3 style="margin-top:0; text-align:center;">بازی حافظه 🎈</h3>
    <div class="grid" id="grid"></div>
  </div>

  <div id="tab-trans" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مترجم جامع گوگل</h3>
    <label>متن ورودی (به هر زبانی):</label>
    <textarea id="sourceText" placeholder="متن خود را بنویسید..."></textarea>
    
    <label style="margin-top:10px; display:block;">ترجمه به زبان مقصد:</label>
    <select id="targetLang">
      <option value="en" selected>انگلیسی (English)</option>
      <option value="fa">فارسی (Persian)</option>
      <option value="ar">عربی (Arabic)</option>
      <option value="tr">ترکی استانبولی (Turkish)</option>
      <option value="fr">فرانسوی (French)</option>
      <option value="de">آلمانی (German)</option>
      <option value="es">اسپانیایی (Spanish)</option>
      <option value="ru">روسی (Russian)</option>
    </select>
    <button class="action-btn" onclick="translateText()">ترجمه آنلاین</button>
    <h4>نتیجه ترجمه:</h4>
    <div class="result-container">
      <button id="speakBtn" class="audio-btn" onclick="speakTranslation()" title="تلفظ صوتی">🔊</button>
      <div id="resultText">نتیجه اینجا نمایش داده می‌شود...</div>
      <div id="pronunciationText" class="pronunciation-box" style="display:none;"></div>
    </div>
  </div>

  <div id="tab-ai" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مولد تصویر هوشمند 🎨</h3>
    <label>توصیف تصویر به فارسی یا انگلیسی:</label>
    <input type="text" id="aiPrompt" placeholder="مثلاً: یک کلبه چوبی زیبا در جنگل‌های شمال ایران">
    <button class="action-btn" style="background:#9c27b0;" onclick="generateImage()">ساخت تصویر با AI</button>
    <div id="aiStatus" style="margin-top:10px; text-align:center; font-size:14px; color:#666;"></div>
    <img id="aiResultImg" class="ai-img-result" alt="AI Generated Image">
  </div>

  <div id="tab-upload" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">آپلود و گالری جهانی (Supabase) 📸</h3>
    <label>انتخاب و آپلود عکس جدید:</label>
    <input type="file" id="imageInput" accept="image/*">
    <button class="action-btn" style="background:#009688;" onclick="uploadToSupabase()">ارسال به گالری جهانی</button>
    <div id="uploadStatus" style="margin-top:10px; font-size:13px; text-align:center;"></div>
    <h4 style="margin-top:20px;">عکس‌های منتشرشده برای همه کاربران:</h4>
    <div class="gallery" id="galleryGrid"></div>
  </div>

  <script>
    /* تنظیمات دیتابیس سوپابیس */
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // آدرس پروژه سوپابیس
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // کلید عمومی (anon key)
    
    let supabaseClient = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let currentTranslatedText = '';
    let currentTargetLang = 'en';

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
      
      if (tab === 'upload') {
        loadSupabaseGallery();
      }
    }

    /* بازی */
    const icons = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
    let flipped = [], matched = 0;
    icons.sort(() => 0.5 - Math.random());
    const grid = document.getElementById('grid');
    icons.forEach((icon) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.onclick = () => {
        if (flipped.length < 2 && !card.classList.contains('flipped')) {
          card.classList.add('flipped');
          card.textContent = icon;
          flipped.push(card);
          if (flipped.length === 2) {
            if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
              matched += 2;
              flipped = [];
              if (matched === icons.length) setTimeout(() => alert('آفرین! 🎉'), 300);
            } else {
              setTimeout(() => {
                flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
                flipped = [];
              }, 800);
            }
          }
        }
      };
      grid.appendChild(card);
    });

    /* مترجم آنلاین به همراه تلفظ متنی و صوتی */
    async function translateText() {
      const text = document.getElementById('sourceText').value;
      const target = document.getElementById('targetLang').value;
      const resultBox = document.getElementById('resultText');
      const speakBtn = document.getElementById('speakBtn');
      const pronBox = document.getElementById('pronunciationText');

      if (!text.trim()) { 
        resultBox.textContent = 'لطفاً متنی برای ترجمه وارد کنید.'; 
        speakBtn.style.display = 'none';
        pronBox.style.display = 'none';
        return; 
      }
      
      resultBox.textContent = 'در حال ترجمه...';
      speakBtn.style.display = 'none';
      pronBox.style.display = 'none';

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&dt=rm&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        
        let translated = '';
        let pronunciation = '';

        if (data[0]) {
          data[0].forEach(item => { 
            if (item[0]) translated += item[0];
            if (item[2]) pronunciation += item[2];
          });
        }

        currentTranslatedText = translated;
        currentTargetLang = target;
        resultBox.textContent = translated;
        speakBtn.style.display = 'flex';

        if (pronunciation && pronunciation.trim() !== '') {
          pronBox.textContent = 'تلفظ متنی: ' + pronunciation;
          pronBox.style.display = 'block';
        }

      } catch (err) {
        resultBox.textContent = 'خطا در ارتباط با سرور ترجمه.';
      }
    }

    /* تابع خواندن صوتی متون */
    function speakTranslation() {
      if (!currentTranslatedText) return;
      const utterance = new SpeechSynthesisUtterance(currentTranslatedText);
      utterance.lang = currentTargetLang;
      window.speechSynthesis.speak(utterance);
    }

    /* ساخت تصویر با هوش مصنوعی */
    async function generateImage() {
      const prompt = document.getElementById('aiPrompt').value;
      const status = document.getElementById('aiStatus');
      const img = document.getElementById('aiResultImg');
      
      if (!prompt.trim()) { alert('لطفاً توصیف تصویر را بنویسید.'); return; }
      
      status.textContent = 'در حال ساخت تصویر با هوش مصنوعی... لطفاً چند ثانیه صبر کنید.';
      img.style.display = 'none';

      try {
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(prompt)}`);
        const transData = await transRes.json();
        let enPrompt = '';
        transData[0].forEach(item => { if (item[0]) enPrompt += item[0]; });

        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enPrompt)}?width=512&height=512&nologo=true`;
        
        img.src = imageUrl;
        img.onload = () => {
          status.textContent = '';
          img.style.display = 'block';
        };
      } catch (e) {
        status.textContent = 'خطا در ساخت تصویر.';
      }
    }

    /* آپلود مستقیم فایل به سوپابیس */
    async function uploadToSupabase() {
      const fileInput = document.getElementById('imageInput');
      const status = document.getElementById('uploadStatus');
      
      if (!supabaseClient) {
        alert('لطفاً ابتدا SUPABASE_URL و SUPABASE_ANON_KEY را در کد برنامه جای‌گذاری کنید.');
        return;
      }
      
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('لطفاً یک عکس انتخاب کنید.');
        return;
      }

      const file = fileInput.files[0];
      const fileName = Date.now() + '_' + file.name;
      status.textContent = 'در حال آپلود عکس به سوپابیس...';

      try {
        const { data, error } = await supabaseClient.storage.from('photos').upload(fileName, file);
        if (error) throw error;

        status.textContent = 'عکس با موفقیت آپلود شد و برای همه قابل مشاهده است!';
        fileInput.value = '';
        loadSupabaseGallery();
      } catch (err) {
        status.textContent = 'خطا در آپلود عکس: ' + err.message;
      }
    }

    /* بارگیری لیست عکس‌ها از سوپابیس */
    async function loadSupabaseGallery() {
      const gallery = document.getElementById('galleryGrid');
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient.storage.from('photos').list('', { sortBy: { column: 'created_at', order: 'desc' } });
        if (error) throw error;

        gallery.innerHTML = '';
        data.forEach(item => {
          if (item.name !== '.emptyFolderPlaceholder') {
            const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${item.name}`;
            const img = document.createElement('img');
            img.src = publicUrl;
            gallery.appendChild(img);
          }
        });
      } catch (err) {
        console.error('خطا در دریافت لیست عکس‌ها:', err.message);
      }
    }
  </script>
</body>
</html>
