<script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
    }

    /* بازی */
    const icons = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
    let flipped = [], matched = 0;
    icons.sort(() => 0.5 - Math.random());
    const grid = document.getElementById('grid');
    icons.forEach((icon) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.onclick = () => {
        if (flipped.length < 2 && !card.classList.contains('flipped')) {
          card.classList.add('flipped');
          card.textContent = icon;
          flipped.push(card);
          if (flipped.length === 2) {
            if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
              matched += 2;
              flipped = [];
              if (matched === icons.length) setTimeout(() => alert('آفرین! 🎉'), 300);
            } else {
              setTimeout(() => {
                flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
                flipped = [];
              }, 800);
            }
          }
        }
      };
      grid.appendChild(card);
    });

    /* موتور ترجمه دقیق گوگل بدون فینگلیش و بدون مشکل CORS */
    async function fetchTranslation(text, targetLang) {
      if (!text || !text.trim()) return '';
      
      try {
        const googleUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        // استفاده از پروکسی معتبر برای دور زدن محدودیت‌های امنیتی اندروید
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(googleUrl)}`;
        
        const res = await fetch(proxyUrl);
        const data = await res.json();
        const parsedData = JSON.parse(data.contents);
        
        let translatedText = '';
        if (parsedData && parsedData[0] && Array.isArray(parsedData[0])) {
          parsedData[0].forEach(item => {
            if (item && item[0]) {
              translatedText += item[0];
            }
          });
        }
        return translatedText || text;
      } catch (err) {
        // روش مستقیم پشتیبان
        try {
          const directRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
          const directData = await directRes.json();
          let txt = '';
          if (directData && directData[0]) {
            directData[0].forEach(item => { if (item[0]) txt += item[0]; });
          }
          return txt || text;
        } catch(e) {
          return text;
        }
      }
    }

    /* بخش ترجمه متن */
    async function translateText() {
      const text = document.getElementById('sourceText').value;
      const target = document.getElementById('targetLang').value;
      const resultBox = document.getElementById('resultText');
      
      if (!text.trim()) { resultBox.textContent = 'لطفاً متنی برای ترجمه وارد کنید.'; return; }
      resultBox.textContent = 'در حال ترجمه... لطفاً صبر کنید';
      
      const translated = await fetchTranslation(text, target);
      resultBox.textContent = translated || 'خطا در دریافت ترجمه.';
    }

    /* پخش صوتی ترجمه */
    function speakTranslation() {
      const text = document.getElementById('resultText').textContent;
      const lang = document.getElementById('targetLang').value;
      if (!text || text.includes('لطفاً') || text.includes('در حال ترجمه')) return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* ترجمه خودکار پرامپت ساخت تصویر */
    let translateTimer;
    function autoTranslatePrompt() {
      clearTimeout(translateTimer);
      translateTimer = setTimeout(async () => {
        const prompt = document.getElementById('aiPrompt').value;
        const enInput = document.getElementById('aiPromptEn');
        if (!prompt.trim()) { enInput.value = ''; return; }
        
        enInput.placeholder = 'در حال ترجمه اتوماتیک...';
        const translated = await fetchTranslation(prompt, 'en');
        if (translated) enInput.value = translated;
      }, 500);
    }

    /* ساخت تصویر با AI */
    async function generateImage() {
      const promptFa = document.getElementById('aiPrompt').value;
      let enPrompt = document.getElementById('aiPromptEn').value;
      const status = document.getElementById('aiStatus');
      const img = document.getElementById('aiResultImg');
      
      if (!promptFa.trim() && !enPrompt.trim()) { alert('لطفاً توصیف تصویر را بنویسید.'); return; }
      
      status.textContent = 'در حال ساخت تصویر... لطفاً صبر کنید.';
      img.style.display = 'none';

      if (promptFa.trim() && (!enPrompt.trim() || enPrompt === promptFa)) {
        enPrompt = await fetchTranslation(promptFa, 'en');
        document.getElementById('aiPromptEn').value = enPrompt;
      }

      if (!enPrompt.trim()) enPrompt = promptFa;

      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enPrompt)}?width=512&height=512&seed=${seed}&nologo=true`;
      
      img.src = imageUrl;
      img.onload = () => {
        status.textContent = '';
        img.style.display = 'block';
      };
      img.onerror = () => {
        status.textContent = 'خطا در بارگذاری تصویر. فیلترشکن را بررسی کنید.';
      };
    }
  </script>
