<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sarina-Ai</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    
    /* هدر بالای صفحه */
    .top-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4caf50;
    }
    .youtube-link {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
      font-size: 13px;
    }
    .youtube-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .header { font-size: 24px; font-weight: bold; color: #2c3e50; margin-bottom: 15px; }
    
    /* منوی تب‌ها */
    .nav { display: flex; gap: 6px; margin-bottom: 20px; width: 100%; max-width: 500px; flex-wrap: wrap; }
    .nav button { flex: 1; min-width: 100px; padding: 10px 5px; border: none; background: #e0e0e0; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .nav button.active { background: #4caf50; color: white; }
    
    .tab-content { display: none; width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .tab-content.active { display: block; }
    
    /* بازی */
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .card { aspect-ratio: 1; background: #2196f3; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; color: white; }
    .card.flipped { background: #fff; border: 2px solid #2196f3; }
    
    /* ورودی‌ها و دکمه‌ها */
    textarea, input[type="text"] { width: 100%; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-top: 8px; }
    textarea { height: 80px; resize: none; }
    select, .action-btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; }
    .action-btn { background: #ff9800; color: white; border: none; cursor: pointer; }
    .result-box { background: #f0f0f0; min-height: 60px; padding: 10px; border-radius: 8px; margin-top: 10px; word-break: break-word; }

    /* گالری تصاویر */
    .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
    .ai-img-result { width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <!-- هدر بالای صفحه -->
  <div class="top-bar">
    <!-- عکس پروفایل سمت راست -->
    <img src="https://lh3.googleusercontent.com/d/1y-npJ0RAY2mvE_ER6fXLXKv7WchFHPeJ" class="user-avatar" alt="User Avatar">
    
    <!-- لینک کانال یوتیوب سمت چپ -->
    <a href="https://www.youtube.com/@naturescenic2" target="_blank" class="youtube-link">
      <span>طبیعت ایران naturescenic2</span>
      <img src="https://lh3.googleusercontent.com/d/1EZf35v8476qtDC_rTS_h-6-_zIq0RNTh" class="youtube-logo" alt="YouTube">
    </a>
  </div>

  <div class="header">sarina-Ai 🚀</div>

  <!-- منوی تب‌ها -->
  <div class="nav">
    <button id="btn-game" class="active" onclick="switchTab('game')">🎮 بازی</button>
    <button id="btn-trans" onclick="switchTab('trans')">🌐 مترجم</button>
    <button id="btn-ai" onclick="switchTab('ai')">🎨 ساخت تصویر</button>
    <button id="btn-upload" onclick="switchTab('upload')">📸 گالری عکس</button>
  </div>

  <!-- تب بازی -->
  <div id="tab-game" class="tab-content active">
    <h3 style="margin-top:0; text-align:center;">بازی حافظه 🎈</h3>
    <div class="grid" id="grid"></div>
  </div>

  <!-- تب مترجم -->
  <div id="tab-trans" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مترجم آنلاین گوگل</h3>
    <label>متن (فارسی یا هر زبانی):</label>
    <textarea id="sourceText" placeholder="متن خود را بنویسید..."></textarea>
    <label style="margin-top:10px; display:block;">ترجمه به زبان:</label>
    <select id="targetLang">
      <option value="en" selected>انگلیسی (English)</option>
      <option value="fa">فارسی</option>
      <option value="ar">عربی</option>
      <option value="tr">ترکی استانبولی</option>
      <option value="fr">فرانسوی</option>
      <option value="de">آلمانی</option>
      <option value="es">اسپانیایی</option>
    </select>
    <button class="action-btn" onclick="translateText()">ترجمه آنلاین</button>
    <h4>نتیجه ترجمه:</h4>
    <div class="result-box" id="resultText">نتیجه اینجا نمایش داده می‌شود...</div>
  </div>

  <!-- تب ساخت تصویر با هوش مصنوعی -->
  <div id="tab-ai" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">مولد تصویر هوشمند 🎨</h3>
    <label>توصیف تصویر به فارسی یا انگلیسی:</label>
    <input type="text" id="aiPrompt" placeholder="مثلاً: یک کلبه چوبی زیبا در جنگل‌های شمال ایران">
    <button class="action-btn" style="background:#9c27b0;" onclick="generateImage()">ساخت تصویر با AI</button>
    <div id="aiStatus" style="margin-top:10px; text-align:center; font-size:14px; color:#666;"></div>
    <img id="aiResultImg" class="ai-img-result" alt="AI Generated Image">
  </div>

  <!-- تب آپلود و گالری عکس -->
  <div id="tab-upload" class="tab-content">
    <h3 style="margin-top:0; text-align:center;">آپلود و اشتراک عکس 📸</h3>
    <input type="file" id="imageInput" accept="image/*" onchange="previewAndSaveImage()">
    <div class="gallery" id="galleryGrid"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
    }

    /* بازی */
    const icons = ['🐶', '🐱', '🐭', '🐹', '🐶', '🐱', '🐭', '🐹'];
    let flipped = [], matched = 0;
    icons.sort(() => 0.5 - Math.random());
    const grid = document.getElementById('grid');
    icons.forEach((icon) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.icon = icon;
      card.onclick = () => {
        if (flipped.length < 2 && !card.classList.contains('flipped')) {
          card.classList.add('flipped');
          card.textContent = icon;
          flipped.push(card);
          if (flipped.length === 2) {
            if (flipped[0].dataset.icon === flipped[1].dataset.icon) {
              matched += 2;
              flipped = [];
              if (matched === icons.length) setTimeout(() => alert('آفرین! 🎉'), 300);
            } else {
              setTimeout(() => {
                flipped.forEach(c => { c.classList.remove('flipped'); c.textContent = ''; });
                flipped = [];
              }, 800);
            }
          }
        }
      };
      grid.appendChild(card);
    });

    /* مترجم آنلاین */
    async function translateText() {
      const text = document.getElementById('sourceText').value;
      const target = document.getElementById('targetLang').value;
      const resultBox = document.getElementById('resultText');
      if (!text.trim()) { resultBox.textContent = 'لطفاً متنی برای ترجمه وارد کنید.'; return; }
      resultBox.textContent = 'در حال ترجمه...';
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        let translated = '';
        data[0].forEach(item => { if (item[0]) translated += item[0]; });
        resultBox.textContent = translated;
      } catch (err) {
        resultBox.textContent = 'خطا در ارتباط با سرور ترجمه.';
      }
    }

    /* ساخت تصویر با هوش مصنوعی */
    async function generateImage() {
      const prompt = document.getElementById('aiPrompt').value;
      const status = document.getElementById('aiStatus');
      const img = document.getElementById('aiResultImg');
      
      if (!prompt.trim()) { alert('لطفاً توصیف تصویر را بنویسید.'); return; }
      
      status.textContent = 'در حال ساخت تصویر با هوش مصنوعی... لطفاً چند ثانیه صبر کنید.';
      img.style.display = 'none';

      try {
        // ترجمه خودکار به انگلیسی برای کیفیت بیشتر در AI
        const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(prompt)}`);
        const transData = await transRes.json();
        let enPrompt = '';
        transData[0].forEach(item => { if (item[0]) enPrompt += item[0]; });

        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enPrompt)}?width=512&height=512&nologo=true`;
        
        img.src = imageUrl;
        img.onload = () => {
          status.textContent = '';
          img.style.display = 'block';
        };
      } catch (e) {
        status.textContent = 'خطا در ساخت تصویر.';
      }
    }

    /* آپلود و ذخیره عکس */
    function previewAndSaveImage() {
      const fileInput = document.getElementById('imageInput');
      const gallery = document.getElementById('galleryGrid');
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          gallery.appendChild(img);
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }
  </script>
</body>
</html>
